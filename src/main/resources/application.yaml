server:
  port: 8080

app:
  security:
    # Replace this development-only value with a random secret of at least 32 bytes.
    jwt-secret: ${JWT_SECRET:local-development-secret-change-me-32bytes}

spring:
  application:
    name: cookie-clicker-api

  datasource:
    url: jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5433}/${DB_NAME:base_db}
    username: ${DB_USER:postgres}
    password: ${DB_PASSWORD:postgrespassword}
    driver-class-name: org.postgresql.Driver

  jpa:
    hibernate:
      ddl-auto: update # For classroom development only. Prefer migrations in production.
    show-sql: false
    open-in-view: false
